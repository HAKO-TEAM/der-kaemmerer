<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 520" font-family="Helvetica, Arial, sans-serif">
  <rect width="1000" height="520" fill="#ffffff"/>

  <text x="60" y="56" font-family="Georgia, 'Times New Roman', serif" font-size="32" font-weight="700" fill="#1a2744">Wo am st&#228;rksten zu niedrig geplant wird</text>
  <text x="60" y="88" font-size="17" fill="#64748b">Typische &#220;berschreitung des Ansatzes durch das Ist &#8211; nach Kostenblock.</text>

  <!-- Bars: base x=340, scale 22px per % -->
  <!-- Zinsen 22% -->
  <text x="320" y="152" text-anchor="end" font-size="16" font-weight="700" fill="#1a2744">Zinsen</text>
  <rect x="340" y="132" width="484" height="30" fill="#7f1d1d"/>
  <text x="838" y="153" font-size="16" font-weight="700" fill="#7f1d1d">+22&#8201;%</text>

  <!-- Sozialleistungen 18% -->
  <text x="320" y="212" text-anchor="end" font-size="16" font-weight="700" fill="#1a2744">Sozialleistungen / HzE</text>
  <rect x="340" y="192" width="396" height="30" fill="#a62a2a"/>
  <text x="750" y="213" font-size="16" font-weight="700" fill="#a62a2a">+18&#8201;%</text>

  <!-- Energie 14% -->
  <text x="320" y="272" text-anchor="end" font-size="16" font-weight="700" fill="#1a2744">Energie</text>
  <rect x="340" y="252" width="308" height="30" fill="#c8991f"/>
  <text x="662" y="273" font-size="16" font-weight="700" fill="#b8860b">+14&#8201;%</text>

  <!-- Personal 7% -->
  <text x="320" y="332" text-anchor="end" font-size="16" font-weight="700" fill="#1a2744">Personal</text>
  <rect x="340" y="312" width="154" height="30" fill="#1a2744"/>
  <text x="508" y="333" font-size="16" font-weight="700" fill="#1a2744">+7&#8201;%</text>

  <!-- baseline -->
  <line x1="340" y1="120" x2="340" y2="356" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="340" y="378" font-size="12" fill="#94a3b8">Ansatz = 0 %</text>

  <line x1="60" y1="460" x2="940" y2="460" stroke="#e2e8f0" stroke-width="1"/>
  <text x="60" y="482" font-size="12.5" fill="#94a3b8">Illustrative Gr&#246;&#223;enordnungen; die tats&#228;chliche &#220;berschreitung h&#228;ngt von Kommune, Konjunktur und Zinsniveau ab.</text>
</svg>
